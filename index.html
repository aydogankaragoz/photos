<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14110f">
<title>Fotoğraflar</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 16px; max-width: 1400px; margin: 0 auto; }
.year { position: relative; display: block; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: #2a2522; color: #fff; text-decoration: none; }
.year img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
.year img.ok { opacity: 1; }
.year .cap { position: absolute; inset: auto 0 0 0; padding: 28px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.72)); }
.year .cap b { display: block; font: 400 26px/1.1 Georgia, "Times New Roman", serif; }
.year .cap span { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
.year:focus-visible { outline: 3px solid #e9c46a; outline-offset: 2px; }
.sum { color: inherit; opacity: .7; margin: 0 16px; }
</style>
</head>
<body>
<main id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="on">
    <p class="eyebrow">Arşiv</p>
    <h1>Fotoğraflar</h1>
    <label for="pw" class="sr">Şifre</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required placeholder="Şifre" autofocus>
    <label class="remember"><input id="remember" type="checkbox" checked> <span>Bu cihazda hatırla</span></label>
    <button id="unlockBtn" type="submit">Aç</button>
    <p id="lockMsg" class="lock-msg" role="status" aria-live="polite"></p>
  </form>
</main>
<div id="app" hidden>
  <header class="top"><div class="top-row"><h1 class="brand">Fotoğraflar</h1><span id="count" class="count"></span>
    <div class="actions"><button id="logout" class="chip-btn">Kilitle</button></div></div></header>
  <nav class="years" id="years" aria-label="Yıllar"></nav>
</div>
<script>
(function () {
  'use strict';
  var subtle = window.crypto && window.crypto.subtle, CFG = null, KEY = null;
  function $(s) { return document.querySelector(s); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem('g_' + k); if (v === null) localStorage.removeItem('g_' + k); else localStorage.setItem('g_' + k, v); } catch (e) { return null; } }
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function hexBytes(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bin(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }); }
  function dec(buf) { return subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, KEY, new Uint8Array(buf, 12)); }
  function msg(s) { $('#lockMsg').textContent = s; $('#lockMsg').className = 'lock-msg err'; }
  function derive(pw) {
    return subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (b) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: hexBytes(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' }, b, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kek) { var w = unb64(CFG.wrapped); return subtle.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12) }, kek, w.slice(12)); })
      .then(function (raw) { return subtle.importKey('raw', raw, 'AES-GCM', true, ['decrypt']); });
  }
  function open(key) { KEY = key; return bin('data/manifest.bin').then(dec).then(function (d) { return JSON.parse(new TextDecoder().decode(d)); }); }
  function start(m) {
    $('#lock').hidden = true; $('#app').hidden = false;
    var total = m.galleries.reduce(function (s, g) { return s + g.count; }, 0);
    $('#count').textContent = total + ' fotoğraf';
    $('#years').innerHTML = m.galleries.map(function (g) {
      return '<a class="year" href="../' + esc(g.repo) + '/"><img alt="" data-c="' + esc(g.cover || '') + '"><span class="cap"><b>' + esc(g.title) + '</b><span>' + g.count + ' fotoğraf</span></span></a>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.year img'), function (img) {
      var c = img.getAttribute('data-c'); if (!c) return;
      bin(c).then(dec).then(function (d) { img.onload = function () { img.className = 'ok'; }; img.src = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })); }).catch(function () {});
    });
  }
  if (!subtle) { msg('Bu tarayıcı desteklenmiyor.'); return; }
  var ready = fetch('data/config.json').then(function (r) { return r.json(); }).then(function (c) { CFG = c; });
  ready.then(function () {
    var saved = store('key_' + CFG.kid); if (!saved) return;
    return subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt']).then(open).then(start).catch(function () { store('key_' + CFG.kid, null); });
  });
  $('#lockForm').addEventListener('submit', function (e) {
    e.preventDefault(); $('#unlockBtn').disabled = true; $('#lockMsg').textContent = 'Açılıyor…'; $('#lockMsg').className = 'lock-msg';
    ready.then(function () { return derive($('#pw').value); }).then(function (k) {
      return open(k).then(function (m) { if ($('#remember').checked) subtle.exportKey('raw', k).then(function (r) { store('key_' + CFG.kid, b64(r)); }); start(m); });
    }).catch(function (err) { msg(err && err.message === 'net' ? 'Bağlantı hatası. Tekrar deneyin.' : 'Şifre yanlış. Tekrar deneyin.'); $('#pw').select(); })
      .then(function () { $('#unlockBtn').disabled = false; });
  });
  $('#logout').addEventListener('click', function () { store('key_' + CFG.kid, null); location.reload(); });
})();
</script>
</body>
</html>
